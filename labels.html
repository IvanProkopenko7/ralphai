<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RalphAI - Labels Library</title>
  <meta name="description" content="Reference gallery of supported and upcoming Ralph Lauren labels." />
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <link rel="preload" href="labels.js" as="script" />
  <link rel="preload" as="image"
    href="/label_images/supported_labels/polo_by_ralph_lauren/2020s_yellow_QR_code_sweater.jpg"
    fetchpriority="high" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="labels.js"></script>
</head>

<body>
  <header class="navbar">
    <a href="/" class="nav-logo">RALPHAI</a>
    <nav class="nav-links">
      <a href="about.html" class="nav-about" data-i18n="navAbout">ABOUT</a>
      <a href="labels.html" class="nav-labels nav-labels--active" data-i18n="navLabels">LABELS</a>
      <a href="mailto:contact@ralphai.tech" class="nav-kontakt" data-i18n="navContact" id="navContactLink">KONTAKT</a>
    </nav>
  </header>

  <main class="main-content main-content--labels">
    <section class="labels-page-wrapper" aria-labelledby="supported-labels-heading">
      <h2 id="supported-labels-heading" class="labels-section-title">SUPPORTED LABELS</h2>
      <div id="supported-groups"></div>
    </section>

    <section class="labels-page-wrapper" aria-labelledby="upcoming-labels-heading">
      <h2 id="upcoming-labels-heading" class="labels-section-title labels-section-title--upcoming">UPCOMING LABELS</h2>
      <div id="upcoming-groups"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-author"><span data-i18n="footerCreatedBy">Stworzone przez</span> <strong>Ivan Prokopenko</strong>
    </p>
    <p class="footer-email">email: <a href="mailto:contact@ralphai.tech" id="footerEmailLink">contact@ralphai.tech</a>
    </p>
    <a href="https://www.reddit.com/user/Neat-Remote-8655/" class="footer-reddit" target="_blank"
      rel="noopener">reddit</a>
    <a href="https://github.com/IvanProkopenko7/ralphai" class="footer-github" target="_blank" rel="noopener">github</a>
  </footer>
  <div class="footer-collect-bar"><span data-i18n="collectNote">Zdjecia bez wykrytej metki i wyniki o niskiej pewnosci moga byc anonimowo zapisywane, aby ulepszac model</span></div>
  <script>
    // Instant skeleton placeholders (white boxes + spinner) so the footer
    // starts below the fold. labels.js replaces them with real cards.
    (function () {
      function paint(id, n) {
        var host = document.getElementById(id);
        if (!host) return;
        var cards = '';
        for (var i = 0; i < n; i++) {
          cards += '<article class="label-card" aria-hidden="true">' +
            '<div class="label-card-media label-card-media--skeleton label-card-media--loading"></div>' +
            '<p class="label-card-caption">&nbsp;</p></article>';
        }
        host.innerHTML = '<div class="labels-grid" aria-hidden="true">' + cards + '</div>';
      }
      paint('supported-groups', 8);
      paint('upcoming-groups', 4);
    })();
  </script>
</body>

</html>
