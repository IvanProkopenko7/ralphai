name = "ralph-ai-proxy"
account_id = "83a84d47c7a140d26af6453355965222"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[[r2_buckets]]
bucket_name = "ralphai-fails"
binding = "FAILS_BUCKET"

# Keep-warm: ping the HF Space every 10 min so free-tier sleep (48h) never
# triggers. ~144 req/day, far inside free quotas on both sides.
[triggers]
crons = ["*/10 * * * *"]

# After deploying, run:
#   wrangler secret put RALPH_Ai_TOKEN
# and paste your Hugging Face token when prompted.
